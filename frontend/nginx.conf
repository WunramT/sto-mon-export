# Frontend-Container: liefert die Vue-App aus und leitet /api an das Backend weiter.
# Basis: frontend/nginx.conf aus dem MLP-Projekt (läuft so auf dpn-svr-iot hinter dem Host-nginx).
# ${VITE_BASE_PATH}, ${BACKEND_HOST}, ${BACKEND_PORT} ersetzt entrypoint.sh beim Start (envsubst).

# Echte Client-Adresse: Anfragen kommen über den Host-nginx im Docker-Netz. Nur dessen Angabe in
# X-Forwarded-For wird vertraut (von rechts gelesen), eine vom Browser mitgeschickte Adresse nicht.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Login-Bremse gegen Passwort-Raten, je Client
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json text/csv;

    client_max_body_size 16M;

    # Sicherheits-Header: per include in jeder location mit eigenem add_header (nginx erbt sonst nicht)
    include /etc/nginx/snippets/sicherheit.conf;

    # Anmeldung (gebremst)
    location ${VITE_BASE_PATH}api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @zu_viele_anmeldungen;
        resolver ${DNS_RESOLVER} valid=30s;
        set $backend_upstream ${BACKEND_HOST};
        rewrite ^${VITE_BASE_PATH}api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (Auswirkung über alle Materialien kann mit echten Daten dauern → lange Timeouts)
    location ${VITE_BASE_PATH}api/ {
        resolver ${DNS_RESOLVER} valid=30s;
        set $backend_upstream ${BACKEND_HOST};
        rewrite ^${VITE_BASE_PATH}api/(.*)$ /api/$1 break;
        # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.missing-internal.missing-internal
        proxy_pass http://$backend_upstream:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_redirect / ${VITE_BASE_PATH};
    }

    # Gehashte Assets dauerhaft cachen
    location ~* ^${VITE_BASE_PATH}assets/(.*)$ {
        alias /usr/share/nginx/html/assets/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/sicherheit.conf;
    }

    # SPA unter dem Basis-Pfad; index.html nie cachen, damit nach einem Deploy sofort die neue Version lädt
    location ${VITE_BASE_PATH} {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ ${VITE_BASE_PATH}index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/sicherheit.conf;
    }

    location @zu_viele_anmeldungen {
        default_type application/json;
        return 429 '{"fehler":"Zu viele Anmeldeversuche – bitte eine Minute warten."}';
    }

    # Healthcheck für Docker/Jenkins
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
